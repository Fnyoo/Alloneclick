[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "serverkit"
version = "0.1.0"
description = "SERVERKIT CLI - All-in-One Linux Server Toolkit (Ubuntu/Debian)"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
pretty = ["rich"]

[project.scripts]
serverkit = "serverkit.menu:main"

[tool.setuptools]
packages = ["serverkit", "serverkit.configurators"]
